name: Sync dashboard data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dashboard-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest dashboard data
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            'https://script.google.com/macros/s/AKfycbx4_tZukK_poowvvBCYoV1wygn-wStEVOHTel7oyC3w1_g3ZPcLKHWtGmzM_T8nw50/exec' \
            --output dashboard-data.json

      - name: Validate dashboard data
        run: |
          node -e "const d=require('./dashboard-data.json'); if(!d.revenueUpdatedAt || !d.revenue?.tp || !d.patients?.tp?.total || !d.sessions?.tp) process.exit(1)"

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- dashboard-data.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-data.json
          git commit -m 'Sync latest dashboard data'
          git push
